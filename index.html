<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classic Tetris</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="game-container">
      <div id="left-panel" class="panel">
        <div class="panel-section">
          <h2>Hold</h2>
          <div class="preview-box">
            <canvas id="hold-canvas" width="100" height="100"></canvas>
          </div>
        </div>
        <div class="panel-section stats">
          <div>Score: <span id="score">0</span></div>
          <div>Level: <span id="level">1</span></div>
          <div>Lines: <span id="lines">0</span></div>
        </div>
      </div>

      <div id="center-playfield">
        <canvas id="game-canvas" width="300" height="600"></canvas>

        <!-- UI Overlays -->
        <div id="menu-overlay" class="overlay">
          <h1 class="title">TETRIS</h1>
          <button id="btn-start" class="btn">Play Game</button>
          <div class="high-score-display">High Score: <span id="high-score-menu">0</span></div>
        </div>

        <div id="pause-overlay" class="overlay hidden">
          <h2>Paused</h2>
          <button id="btn-resume" class="btn">Resume</button>
          <button id="btn-restart-pause" class="btn">Restart</button>
        </div>

        <div id="game-over-overlay" class="overlay hidden">
          <h2>GAME OVER</h2>
          <div>Final Score: <span id="final-score">0</span></div>
          <button id="btn-restart-over" class="btn">Play Again</button>
        </div>
      </div>

      <div id="right-panel" class="panel">
        <div class="panel-section">
          <h2>Next</h2>
          <div class="preview-box" id="next-box-container">
            <canvas id="next-canvas-0" width="100" height="100"></canvas>
            <canvas id="next-canvas-1" width="100" height="100"></canvas>
            <canvas id="next-canvas-2" width="100" height="100"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
